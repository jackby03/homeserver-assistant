name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --workspace --lib --tests
      - name: Documentation tests
        run: cargo test --workspace --doc

  ui:
    name: UI (typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  scripts:
    name: Shell scripts (syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every shell script
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          for file in "${files[@]}"; do
            echo "checking $file"
            bash -n "$file"
          done
      - name: Validate deployment assets
        run: python3 scripts/check-assets.py

      - name: Validate Python helpers (syntax only)
        run: |
          python3 -m py_compile voice/wakeword.py vision/python/face_embed.py
      - name: Validate YAML templates
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          failed = False
          for path in glob.glob("**/*.yaml", recursive=True) + glob.glob("**/*.yml", recursive=True):
              if "node_modules" in path or path.startswith("ui/"):
                  continue
              try:
                  with open(path, encoding="utf-8") as handle:
                      yaml.safe_load(handle)
              except Exception as error:  # noqa: BLE001 - report every bad template
                  print(f"invalid YAML: {path}: {error}", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY

