name: Feature request
description: Propose a capability or an improvement.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        HomeServer Assistant OS prioritizes local-first behavior, security and
        reproducibility. Explain the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include alternatives and tradeoffs.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent / tools / integrations
        - Network / firewall / DNS
        - Runtime / apps / storage
        - UI / kiosk / voice
        - Installation / ISO / deployment
        - Documentation / developer experience
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Does it require cloud access, new permissions or destructive actions?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues and the roadmap.
          required: true
