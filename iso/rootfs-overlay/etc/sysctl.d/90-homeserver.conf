# =============================================================================
# HomeServer Assistant OS - kernel tuning
# =============================================================================
# Installed as /etc/sysctl.d/90-homeserver.conf.
# =============================================================================

# Incus needs IPv4 forwarding for its bridges (NAT mode and the DMZ). Incus
# sets this itself, but setting it here means forwarding is on before Incus
# starts and survives an Incus upgrade that forgets it.
net.ipv4.ip_forward=1

# IPv6 is deliberately not routed: the DMZ has no IPv6 and the appliance does
# not advertise prefixes. The host may still use IPv6 on its uplink (the
# firewall accepts ICMPv6 for neighbour discovery).
net.ipv6.conf.all.forwarding=0

# Keep the appliance responsive on low-RAM hardware: prefer reclaiming page
# cache over swapping (also protects eMMC/SD endurance on laptop panels).
vm.swappiness=10

# Incus/containers plus the kiosk need more inotify instances/watches than the
# desktop defaults.
fs.inotify.max_user_instances=1024
fs.inotify.max_user_watches=524288

# Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which
# can break the Chromium sandbox for *native* chromium builds. The default
# kiosk uses the Chromium snap (it ships its own AppArmor profile), so the
# restriction is kept. Only uncomment this line if you replace the snap with a
# native chromium package from a vetted source - and understand the tradeoff.
# kernel.apparmor_restrict_unprivileged_userns=0

# Bridge netfilter would make every bridged packet traverse iptables before
# nftables; the appliance filters DMZ traffic in the inet table instead.
# Only uncomment if another tool requires bridge netfilter.
# net.bridge.bridge-nf-call-iptables=0
# net.bridge.bridge-nf-call-ip6tables=0
