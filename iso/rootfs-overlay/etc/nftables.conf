#!/usr/sbin/nft -f
# =============================================================================
# HomeServer Assistant OS - nftables loader
# =============================================================================
# Installed as /etc/nftables.conf and loaded by nftables.service at boot.
#
# The appliance ruleset is not written here directly: hs-daemon renders
# /etc/nftables.d/10-hs-network.nft (baseline shipped in
# infra/firewall/nftables.conf) whenever the network configuration changes.
# This loader only includes the rendered snippets, so the daemon never has to
# rewrite a file owned by the package manager.
#
# Manual reload after editing a snippet:
#   sudo nft -c -f /etc/nftables.conf     # validate
#   sudo nft -f /etc/nftables.conf        # apply
# =============================================================================
include "/etc/nftables.d/*.nft"
