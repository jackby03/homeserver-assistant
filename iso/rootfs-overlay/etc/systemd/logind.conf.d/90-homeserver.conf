# =============================================================================
# HomeServer Assistant OS - logind policy (static, pre-first-boot copy)
# =============================================================================
# Installed as /etc/systemd/logind.conf.d/90-homeserver.conf so the appliance
# never suspends on a lid event, even before homeserver-power.service runs.
# homeserver-power.service rewrites this file with identical content and keeps
# it current; keep the two in sync.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandlePowerKey=poweroff
IdleAction=ignore
