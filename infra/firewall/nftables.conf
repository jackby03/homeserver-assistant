#!/usr/sbin/nft -f
# =============================================================================
# HomeServer Assistant OS - baseline nftables ruleset
# =============================================================================
# This file is the *reference rendering* of the authoritative renderer
# `hs_network::firewall::render_nftables` with the appliance defaults:
#
#   lan_bridge        br-lan          dmz_bridge       br-dmz
#   admin_port        8443            dns_port         53
#   dmz_allow_dns     true            dmz_subnet       10.20.30.0/24
#   lan_subnet        192.168.1.0/24 (placeholder, see note below)
#   wan_interface     eth0            allow_dmz_egress true
#
# Runtime contract:
#   * The daemon renders the live ruleset to
#         /var/lib/homecore/firewall/nftables.conf
#     validates it with `validate_isolation` and applies it with `nft -f`.
#   * This baseline is installed as /etc/nftables.d/10-hs-network.nft and
#     loaded at boot by /etc/nftables.conf:
#         include "/etc/nftables.d/*.nft"
#     so DMZ isolation and DMZ egress are enforced from the first boot, before
#     hs-daemon has rendered the live copy.
#   * Keep this file semantically identical to the renderer: any difference
#     must be fixed in hs-network and its golden tests (AGENTS.md section 3.6),
#     not only in the deployed copy.
#
# Security invariants enforced below:
#   * the DMZ bridge can never forward traffic to the LAN bridge;
#   * DMZ workloads can only reach host services on the explicit allow list
#     (local DNS resolver and NTP), and only when DNS is allowed;
#   * the administrator portal is reachable from the trusted LAN only;
#   * DMZ workloads may only reach the internet through the appliance uplink
#     NAT (updates and the outbound tunnel client), never the LAN;
#   * any other inbound or forwarded traffic is dropped.
#
# Manual validation / apply:
#   sudo nft -c -f infra/firewall/nftables.conf
#   sudo nft -f /etc/nftables.conf
# =============================================================================

# The daemon applies a freshly rendered file; this baseline is included from
# /etc/nftables.conf which may be reloaded at runtime. Declaring and deleting
# the tables first makes the load idempotent.
table inet homeserver
delete table inet homeserver
table ip homeserver_nat
delete table ip homeserver_nat

table inet homeserver {
    # Subnet sets. Matching the source subnet in addition to the bridge
    # interface makes source-address spoofing ineffective.
    set dmz_subnets {
        type ipv4_addr
        flags interval
        elements = { 10.20.30.0/24 }
    }
    set lan_subnets {
        type ipv4_addr
        flags interval
        # Placeholder: the daemon renders the real home LAN subnet when it is
        # known, or drops the set and matches the bridge interface only.
        elements = { 192.168.1.0/24 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept comment "return traffic for host-initiated flows"
        ct state invalid counter drop comment "invalid packets"

        iifname "lo" accept comment "loopback"

        # --- Trusted LAN -------------------------------------------------
        # The administrator portal is only reachable from the LAN.
        iifname "br-lan" ip saddr @lan_subnets tcp dport 8443 accept comment "admin portal from LAN"
        iifname "br-lan" ip saddr @lan_subnets tcp dport 53 accept comment "DNS from LAN (TCP)"
        iifname "br-lan" ip saddr @lan_subnets udp dport 53 accept comment "DNS from LAN (UDP)"
        iifname "br-lan" ip saddr @lan_subnets udp dport 123 accept comment "NTP from LAN"
        iifname "br-lan" ip saddr @lan_subnets udp dport 5353 accept comment "mDNS discovery from LAN"
        iifname "br-lan" ip saddr @lan_subnets udp sport 1900 accept comment "SSDP discovery replies from LAN"
        iifname "br-lan" ip saddr @lan_subnets icmp type echo-request accept comment "ICMP diagnostics from LAN"

        # --- Isolated DMZ ------------------------------------------------
        # DMZ workloads may reach the host resolver and NTP only.
        iifname "br-dmz" ip saddr @dmz_subnets tcp dport 53 accept comment "DMZ DNS (TCP)"
        iifname "br-dmz" ip saddr @dmz_subnets udp dport 53 accept comment "DMZ DNS (UDP)"
        iifname "br-dmz" ip saddr @dmz_subnets udp dport 123 accept comment "DMZ NTP"
        # Explicit defence in depth: the portal is never reachable from the DMZ.
        iifname "br-dmz" ip saddr @dmz_subnets tcp dport 8443 counter drop comment "DMZ must never reach the administrator portal"
        # Everything else from the DMZ is dropped by this explicit rule (counted
        # so attempts are auditable when the policy drop is not enough).
        iifname "br-dmz" ip saddr @dmz_subnets counter drop comment "DMZ must never reach other host services"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept comment "return traffic for permitted forwarded flows"
        ct state invalid counter drop comment "invalid forwarded packets"

        # Only the trusted LAN may initiate forwarded flows towards the DMZ.
        iifname "br-lan" oifname "br-dmz" accept comment "LAN may reach DMZ workloads"
        # The DMZ must never reach the LAN. This is the core isolation rule.
        iifname "br-dmz" oifname "br-lan" drop comment "DMZ must never reach LAN"
        # DMZ outbound internet is explicitly allowed through the appliance
        # uplink: required for updates and for the outbound tunnel client
        # (cloudflared/WireGuard). The DMZ -> LAN drop above still wins.
        iifname "br-dmz" oifname "eth0" accept comment "DMZ outbound internet (updates, tunnel)"
        # No other forwarding is permitted; the policy drop above handles it.
    }

    chain output {
        type filter hook output priority filter; policy accept;

        # Host-initiated traffic (encrypted DNS, updates, assistant API) is
        # allowed: the appliance itself is the trusted endpoint.
    }
}

# NAT table: masquerade DMZ egress behind the appliance uplink so updates and
# the outbound tunnel client (cloudflared/WireGuard) work without opening any
# port on the home router.
table ip homeserver_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        oifname "eth0" ip saddr 10.20.30.0/24 masquerade comment "DMZ outbound internet"
    }
}
