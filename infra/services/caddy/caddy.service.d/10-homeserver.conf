# =============================================================================
# Drop-in for the distribution's caddy.service
# Installed as /etc/systemd/system/caddy.service.d/10-homeserver.conf
# =============================================================================
# The stock Ubuntu/Debian unit reads /etc/caddy/Caddyfile but does not load the
# appliance's environment file. Port, hostname and base domain come from
# /etc/homecore/caddy.env so the Caddyfile stays static across devices.
[Service]
EnvironmentFile=-/etc/homecore/caddy.env
# Fail fast on a broken Caddyfile/snippet instead of half-serving traffic.
# The daemon uses the same command to validate rendered app snippets.
ExecStartPre=/usr/bin/caddy validate --config /etc/caddy/Caddyfile
