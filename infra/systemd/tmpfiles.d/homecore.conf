# =============================================================================
# HomeServer Assistant OS - runtime directories and permissions
# =============================================================================
# Installed as /etc/tmpfiles.d/homecore.conf and applied by
# systemd-tmpfiles-setup.service at boot (hs-firstboot also runs
# `systemd-tmpfiles --create` during the offline install).
#
# Layout contract (keep in sync with infra/systemd/README.md and the daemon
# defaults: data dir /var/lib/homecore, config.json, master.key, admin API
# 127.0.0.1:8080, kiosk 127.0.0.1:3000, vision socket /run/homecore/vision.sock).
#
# Type  Path                  Mode  User      Group     Age  Argument
# -----------------------------------------------------------------------------
d /var/lib/homecore          0700  root      root      -    -
d /var/lib/homecore/apps     0700  root      root      -    -
d /var/lib/homecore/backups  0700  root      root      -    -
d /var/lib/homecore/caddy    0700  root      root      -    -
d /var/lib/homecore/firewall 0700  root      root      -    -
d /etc/homecore              0700  root      root      -    -
# Vision socket directory: root:hs-vision mode 2770 (setgid) so hs-vision can
# create /run/homecore/vision.sock as 0660 and the group is inherited from the
# directory, independent of the service's primary group (video, for cameras).
d /run/homecore              2770  root      hs-vision -    -
# Reverse-proxy snippets written by the daemon for Caddy (imported by
# /etc/caddy/Caddyfile). The daemon owns app-*.caddy files only.
d /etc/caddy/apps.d          0755  root      root      -    -
# Firewall snippets rendered by hs-network (included by /etc/nftables.conf).
d /etc/nftables.d            0755  root      root      -    -
# Kiosk Chromium profile.
d /var/lib/kiosk             0700  kiosk     kiosk     -    -
# Vision model cache (optional).
d /var/lib/hs-vision         0700  hs-vision video     -    -
# Environment files for the units (no secrets: the vault holds those).
f /etc/homecore/env          0640  root      root      -    -
f /etc/homecore/caddy.env    0644  root      root      -    -
