# =============================================================================
# HomeServer Assistant OS - system users and groups
# =============================================================================
# Installed as /etc/sysusers.d/homecore.conf and applied by
# systemd-sysusers.service at boot (hs-firstboot also runs `systemd-sysusers`
# explicitly during the offline install).
#
# Users are unprivileged and have no login shell and no password:
#   hs-vision  camera/vision service, primary group video (camera nodes)
#   kiosk      Wayland/Chromium kiosk session on tty1
#
# UIDs/GIDs are allocated dynamically by systemd-sysusers (range 61184-65519);
# never hard-code them in units - hs-kiosk-start computes XDG_RUNTIME_DIR from
# the actual UID.
# =============================================================================

u hs-vision - "HomeServer Assistant vision service" /var/lib/hs-vision /usr/sbin/nologin
u kiosk     - "HomeServer Assistant wall kiosk"    /var/lib/kiosk    /usr/sbin/nologin

# The `u` lines also create a same-named group for each user (systemd-sysusers
# behaviour), which is what owns the vision socket directory
# (/run/homecore 2770 root:hs-vision). hs-vision's primary group is video
# (camera nodes), so it needs membership in its own group to create the socket
# inside the setgid directory.
m hs-vision hs-vision

# Camera and DRM device access.
m hs-vision video
m kiosk     video
m kiosk     render
# Touchscreen / input devices (cage reads libinput, Chromium needs the seat
# session that PAMName=login provides; input group keeps the udev ACL simple).
m kiosk     input
# Audio playback (PipeWire/ALSA nodes).
m kiosk     audio
